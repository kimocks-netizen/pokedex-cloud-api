AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PokeDex Cloud API - Serverless Pokemon API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        DATABASE_URL: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:url}}'
        JWT_SECRET: !Sub '{{resolve:secretsmanager:${JWTSecret}:SecretString:secret}}'
        POKEAPI_BASE_URL: 'https://pokeapi.co/api/v2'
        SQS_QUEUE_URL: !Ref PokemonIngestionQueue
        POKEMON_LIMIT: '151'
        WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  # Auth Functions
  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/auth/login.handler
      Description: User login
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/login
            Method: POST

  AuthRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/auth/register.handler
      Description: User registration
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/register
            Method: POST

  # Pokemon Functions
  PokemonListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/pokemon/list.handler
      Description: List Pokemon with pagination
      Events:
        Api:
          Type: Api
          Properties:
            Path: /pokemon
            Method: GET

  PokemonDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/pokemon/delete.handler
      Description: Delete Pokemon by IDs (admin only)
      Events:
        Api:
          Type: Api
          Properties:
            Path: /pokemon
            Method: DELETE

  PokemonGetByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/pokemon/get-by-id.handler
      Description: Get Pokemon by ID
      Events:
        Api:
          Type: Api
          Properties:
            Path: /pokemon/{id}
            Method: GET

  PokemonDeleteAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/pokemon/delete-all.handler
      Description: Delete all Pokemon (admin only)
      Events:
        Api:
          Type: Api
          Properties:
            Path: /pokemon/all
            Method: DELETE

  # Health Functions
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/health/check.handler
      Description: Health check endpoint
      Events:
        Api:
          Type: Api
          Properties:
            Path: /health
            Method: GET

  # Ingestion Functions
  IngestionTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/ingestion/cron-trigger.handler
      Timeout: 300
      Description: Trigger Pokemon ingestion
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PokemonIngestionQueue.QueueName
      Events:
        CronSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: false

  ManualIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/ingestion/trigger.handler
      Timeout: 300
      Description: Manual ingestion trigger
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PokemonIngestionQueue.QueueName
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ingestion/trigger
            Method: POST

  IngestionJobListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/ingestion/list.handler
      Description: List ingestion jobs
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ingestion/jobs
            Method: GET

  IngestionJobFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/ingestion/fix-jobs.handler
      Description: Fix stuck ingestion jobs
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ingestion/jobs/fix
            Method: POST

  # Job Management Functions
  JobScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/jobs/schedule.handler
      Description: Create scheduled job
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jobs/schedule
            Method: POST

  JobListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/jobs/list.handler
      Description: List user jobs
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jobs
            Method: GET

  JobToggleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/jobs/toggle.handler
      Description: Enable/disable scheduled job
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jobs/{id}/toggle
            Method: PATCH

  JobDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/jobs/delete.handler
      Description: Delete scheduled job
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jobs/{id}
            Method: DELETE

  # DLQ Management Functions
  DLQListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/dlq/list.handler
      Description: List DLQ messages
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dlq/messages
            Method: GET

  DLQStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/dlq/stats.handler
      Description: Get DLQ statistics
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dlq/stats
            Method: GET

  DLQRetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/dlq/retry.handler
      Description: Retry failed message
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PokemonIngestionQueue.QueueName
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dlq/messages/{id}/retry
            Method: POST

  # User Management Functions
  UserListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/users/list.handler
      Description: List all users (admin only)
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users
            Method: GET

  # Worker Functions
  PokemonWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/cron/pokemon-worker.handler
      Timeout: 60
      Description: Process Pokemon from SQS
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PokemonIngestionQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PokemonIngestionQueue.Arn
            BatchSize: 10

  # WebSocket Functions
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/websocket/connect.handler
      Description: WebSocket connect handler

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/apigw/websocket/disconnect.handler
      Description: WebSocket disconnect handler

  # WebSocket API
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'pokedex-websocket-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketDisconnectIntegration}'

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations'

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: !Ref Environment

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # SQS Queue
  PokemonIngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'pokemon-ingestion-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PokemonDLQ.Arn
        maxReceiveCount: 3

  PokemonDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'pokemon-ingestion-dlq-${Environment}'
      MessageRetentionPeriod: 1209600

  # Secrets
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'pokedex-db-${Environment}'
      Description: PostgreSQL connection string
      SecretString: '{"url":"postgresql://pokedex_admin:CHANGE_ME@your-rds-endpoint:5432/pokedex"}'

  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'pokedex-jwt-${Environment}'
      Description: JWT signing secret
      SecretString: '{"secret":"pokedex-jwt-secret-2025-production"}'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  
  QueueUrl:
    Description: SQS Queue URL
    Value: !Ref PokemonIngestionQueue
  
  DLQUrl:
    Description: Dead Letter Queue URL
    Value: !Ref PokemonDLQ
  
  WebSocketUrl:
    Description: WebSocket API URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
